name: Birthday Automation

on:
  schedule:
    # 23:55 по Ташкенту — подготовить открытки на завтра
    - cron: "55 18 * * *"
    # 00:00 по Ташкенту — отправить поздравления именинникам
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      task:
        description: "Что выполнить вручную"
        required: true
        type: choice
        options:
          - prepare
          - send

permissions:
  contents: write

concurrency:
  group: birthday-automation
  cancel-in-progress: false

jobs:
  birthday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Подготовка выполняется по расписанию в 23:55
      # или вручную при выборе prepare.
      - name: Prepare tomorrow's birthday cards
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '55 18 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.task == 'prepare')
        run: python birthday_greetings.py prepare

      # Сохраняем созданные открытки в репозитории.
      - name: Save prepared cards to repository
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '55 18 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.task == 'prepare')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d birthday_cache ] && [ -n "$(find birthday_cache -type f -print -quit)" ]; then
            git add birthday_cache/
            if ! git diff --cached --quiet; then
              git commit -m "Prepare birthday cards"
              git push origin HEAD:main
            else
              echo "No new birthday cards to save."
            fi
          else
            echo "No birthdays to prepare tomorrow."
          fi

      # Отправка выполняется по расписанию в 00:00
      # или вручную при выборе send.
      - name: Send today's birthday greetings
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.task == 'send')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
        run: python birthday_greetings.py send

      # Сохраняем журнал даже если отправка завершилась частичной ошибкой:
      # Python записывает имя после подтверждённой отправки каждого поздравления.
      - name: Save sent-birthday log
        if: |
          always() &&
          (
            (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
            (github.event_name == 'workflow_dispatch' && inputs.task == 'send')
          )
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f birthday_sent.json ]; then
            git add birthday_sent.json
            if ! git diff --cached --quiet; then
              git commit -m "Record sent birthday greetings"
              git push origin HEAD:main
            else
              echo "No sent-birthday changes."
            fi
          else
            echo "No birthday log file exists."
          fi
